# =====================================================================
# Butterfly Theme Config (hexo-theme-butterfly v5.7.0)
# Full-feature configuration for 花独柒's blog
# =====================================================================

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo: /img/netoal.png
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: true

menu:
  主页: / || fas fa-home
  博文||fas fa-list:
    分类: /categories/ || fa fa-archive
    标签: /tags/ || fa fa-tags
    归档: /archives/ || fa fa-folder-open
  生活||fas fa-list:
    分享: /shuoshuo/ || fa fa-comments-o
    相册: /photos/ || fa fa-camera-retro
    音乐: /music/ || fas fa-music
    影视: /movies/ || fas fa-video
  友链: /link/ || fa fa-link
  留言板: /comment/ || fa fa-paper-plane
  关于笔者: /about/ || fas fa-heart

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: ocean
  macStyle: true
  height_limit: false
  word_wrap: true
  copy: true
  language: true
  shrink: true
  fullpage: true

# Social media links
social:
  fab fa-github: https://github.com/ZxlDragonDoctor || Github || '#24292e'
  # 如需展示邮箱/其他平台，把地址换成你自己的即可，例如：
  # fas fa-envelope: mailto:你的邮箱 || Email || '#4a7dbe'
  # fab fa-bilibili: https://space.bilibili.com/你的UID || Bilibili || '#00a1d6'

# --------------------------------------
# Image Settings
# --------------------------------------

favicon: /img/netoal.png

avatar:
  img: /img/total.png
  effect: true

disable_top_img: false
default_top_img: /img/wallhaven-1pq9kv.png
index_img: /img/wallhaven-gp8pdq.jpg
archive_img: /img/wallhaven-kxwp96.jpg
tag_img: /img/wallhaven-p9273e.jpg
tag_per_img:
category_img: /img/wallhaven-p9273e.jpg
category_per_img:
footer_img: /img/wallhaven-gp8pdq.jpg
background: /img/wallhaven-1pq9kv.png

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/zxl_1.jpg
    - /img/zxl_2.jpg
    - /img/zxl_3.png
    - /img/zxl_4.jpg
    - /img/zxl_5.png
    - /img/zxl_6.jpg
    - /img/zxl_7.png
    - /img/zxl_8.png

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page (GitHub Pages will auto-serve /404.html)
error_404:
  enable: true
  subtitle: '页面不见了，或许去主页看看吧 ~'
  background: /img/404.jpg

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

index_site_info_top:
index_top_img_height:

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 纸上谈来终觉浅，绝知此事要躬行
    - 记录生活，分享美好
    - 欢迎来到花独柒的博客

index_layout: 3

index_post_content:
  method: 3
  length: 500

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: true
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/ZxlDragonDoctor
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: true
  text: 如果觉得这篇文章对您有帮助，可以请我喝一杯咖啡哦~
  QR_code:

# Post edit
post_edit:
  enable: true
  url: https://github.com/ZxlDragonDoctor/ZxlDragonDoctor.github.io/edit/main/source/

# Related Articles
related_post:
  enable: true
  limit: 6
  date_type: created

# Choose: 1 / 2 / false
post_pagination: 2

noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文最后更新于
  message_next: 天前，内容可能已过时，请知悉。

# --------------------------------------
# Footer Settings
# --------------------------------------

footer:
  nav:
  owner:
    enable: true
    since: 2023
  copyright:
    enable: true
    version: true
  custom_text: 纸上谈来终觉浅，绝知此事要躬行

# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 纸上谈来终觉浅，绝知此事要躬行
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/ZxlDragonDoctor
  card_announcement:
    enable: true
    content: 欢迎来到花独柒的博客，记录生活，分享美好。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: true
    sort_order:
    limit: 6
    storage: 10
    avatar: true
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    custom_colors:
      - '#49B1F5'
      - '#FF7242'
      - '#00c4b6'
      - '#F47466'
      - '#99a9bf'
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date: 01/08/2024 00:00:00

# --------------------------------------
# Bottom right button
# --------------------------------------

rightside_bottom:

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '簡'

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1
  start:
  end:

rightside_scroll_percent: true

rightside_item_order:
  enable: false
  hide:
  show:

rightside_config_animation: true

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  auto_update: true
  click_to_scroll: true

photofigcaption: true

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Math
# --------------------------------------

math:
  use: mathjax
  per_page: true
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: ams
  katex:
    copy_tex: true

# --------------------------------------
# Search
# --------------------------------------

search:
  use: local_search
  placeholder: 搜索文章关键词...
  algolia_search:
    hitsPerPage: 6
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8
    CDN:
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System
# --------------------------------------

share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# Comments System
# --------------------------------------

comments:
  # 评论系统 (已启用 Waline，需要把 serverURL 换成你自己的评论服务地址后才会生效)
  # 申请地址: https://waline.js.org/
  use: Waline
  text: true
  lazyload: true
  count: true
  card_post_count: true

disqus:
  shortname:
  apikey:

disqusjs:
  shortname:
  apikey:
  option:

livere:
  uid:

gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

valine:
  appId:
  appKey:
  avatar: monsterid
  serverURLs:
  bg:
  visitor: false
  option:

waline:
  serverURL: https://your-waline-server.example.com
  bg:
  pageview: false
  option:
    locale:
      placeholder: 欢迎留下你的评论哦~

utterances:
  repo:
  issue_term: pathname
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

facebook_comments:
  app_id:
  user_id:
  pageSize: 10
  order_by: social
  lang: en_US

twikoo:
  envId:
  region:
  visitor: false
  option:

giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

remark42:
  host:
  siteId:
  option:

artalk:
  server:
  site:
  visitor: false
  option:

# --------------------------------------
# Chat Services (需要对应服务账号，默认关闭)
# --------------------------------------

chat:
  use:
  rightside_button: false
  button_hide_show: false

chatra:
  id:
tidio:
  public_key:
crisp:
  website_id:
knocket:
  identifier:

# --------------------------------------
# Analysis (需要对应平台账号，默认关闭)
# --------------------------------------

baidu_analytics:
google_analytics:
cloudflare_analytics:
microsoft_clarity:
umami_analytics:
  enable: false
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    token:
google_tag_manager:
  tag_id:
  domain:

# --------------------------------------
# Advertisement
# --------------------------------------

google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

ad:
  index:
  aside:
  post:

# --------------------------------------
# Verification
# --------------------------------------

site_verification:

# --------------------------------------
# Beautify / Effect
# --------------------------------------

theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

category_ui:
tag_ui:

rounded_corners_ui: true
text_align_justify: true

mask:
  header: true
  footer: true

preloader:
  enable: true
  source: 1
  pace_css_url:

enter_transitions: true

display_mode: light

beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#F47466'

font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

blog_title_font:
  font_link:
  font_family:

hr_icon:
  enable: true
  icon: '\f0c1'
  icon_top:

activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

# Background effects
canvas_ribbon:
  enable: true
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

canvas_fluttering_ribbon:
  enable: true
  mobile: false

canvas_nest:
  enable: true
  color: '135,180,240'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

fireworks:
  enable: true
  zIndex: 9999
  mobile: false

click_heart:
  enable: true
  mobile: false

clickShowText:
  enable: true
  text:
    - 努力
    - 加油
    - 奋斗
  fontSize: 15px
  random: false
  mobile: false

# --------------------------------------
# Lightbox Settings
# --------------------------------------

lightbox: fancybox

# --------------------------------------
# Tag Plugins settings
# --------------------------------------

series:
  enable: true
  orderBy: 'date'
  order: 1
  number: true

abcjs:
  enable: true
  per_page: true

mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

chartjs:
  enable: true
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0

# --------------------------------------
# Other Settings
# --------------------------------------

pjax:
  enable: true
  exclude:
    # - /music/

snackbar:
  enable: true
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

instantpage: true

lazyload:
  enable: true
  native: false
  field: site
  placeholder: /img/loading.jpg
  blur: true

pwa:
  enable: true
  manifest: /manifest.json
  apple_touch_icon: /img/netoal.png
  favicon_32_32: /img/netoal.png
  favicon_16_16: /img/netoal.png
  mask_icon: /img/netoal.png

Open_Graph_meta:
  enable: true
  option:
    twitter_image: /img/total.png

structured_data:
  enable: true
  alternate_name:
    - 花独柒

css_prefix: true

inject:
  head:
    # - <link rel="stylesheet" href="/xxx.css">
  bottom:
    # - <script src="xxxx"></script>

# CDN Settings
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  custom_format:
  option:
