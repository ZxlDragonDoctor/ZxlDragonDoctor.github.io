# =====================================================================
# ZxlDragonDoctor.github.io - Hexo site config
# =====================================================================

# Site
title: 花独柒
subtitle: 纸上谈来终觉浅，绝知此事要躬行
description: 纸上谈来终觉浅，绝知此事要躬行
keywords: 博客,个人博客,花独柒,猪教授,Hexo,Butterfly
author: 猪教授
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://ZxlDragonDoctor.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: butterfly

# Deployment
deploy:
  type: git
  repo: https://github.com/ZxlDragonDoctor/ZxlDragonDoctor.github.io.git
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# =====================================================================
# Plugins
# =====================================================================

# Local search (search.xml)
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

# Sitemap
sitemap:
  path: sitemap.xml

# nofollow / SEO (optional helper, safe defaults)
nofollow:
  enable: false
